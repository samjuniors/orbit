name: Windows certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-installer:
    name: CLI executable and Inno Setup installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record Windows environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          node --version
          npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build standalone CLI
        run: npm run build:exe
      - name: Build Inno Setup installer
        run: npm run build:installer
      - name: Certify clean install, same-version reinstall and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path $PWD "dist/Orbit-Setup-$version.exe"
          ./scripts/certify-windows-install.ps1 -InstallerPath $installer -ExpectedVersion $version
      - name: Certify deferred self-update and rollback
        run: node scripts/test-windows-update.js
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-CLI-Windows-Certification
          path: |
            dist/orbit.exe
            dist/Orbit-Setup-*.exe
          if-no-files-found: error

  desktop-tray:
    name: Legacy desktop/tray installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:win
      - name: Certify desktop install and launch
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path $PWD "release/Orbit-Desktop-Setup-$version.exe"
          ../../scripts/certify-tray-install.ps1 -InstallerPath $installer
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Desktop-Windows-Certification
          path: apps/tray/release/*.exe
          if-no-files-found: error
